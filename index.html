                                </div>
                                <div className="stat-card bg-emerald-50 border-2 border-emerald-100">
                                    <div className="text-2xl md:text-3xl font-bold text-emerald-600 font-playfair">{stats.total}</div>
                                    <div className="text-xs text-emerald-700 mt-1 font-inter">💐 Total</div>
                                </div>
                            </div>
                        </ScrollReveal>

                        <ScrollReveal delay={0.3}>
                            <div className="flex flex-wrap gap-2 mb-6 justify-center">
                                {[
                                    { key: "all", label: "Semua", count: guests.length },
                                    { key: "hadir", label: "Hadir", count: guests.filter(g => g.attendance === "hadir").length },
                                    { key: "tidak-hadir", label: "Tidak Hadir", count: guests.filter(g => g.attendance === "tidak-hadir").length },
                                    { key: "belum-pasti", label: "Belum Pasti", count: guests.filter(g => g.attendance === "belum-pasti").length }
                                ].map((item) => (
                                    <button
                                        key={item.key}
                                        onClick={() => setFilter(item.key)}
                                        className={`px-4 py-2 rounded-full text-sm font-inter transition-all ${
                                            filter === item.key 
                                                ? 'bg-emerald-500 text-white shadow-lg shadow-emerald-200' 
                                                : 'bg-white text-emerald-600 border border-emerald-200 hover:bg-emerald-50'
                                        }`}
                                    >
                                        {item.label} ({item.count})
                                    </button>
                                ))}
                            </div>
                        </ScrollReveal>

                        <div className="space-y-3">
                            <AnimatePresence>
                                {filteredGuests.map((guest, index) => (
                                    <motion.div
                                        key={guest.id}
                                        initial={{ opacity: 0, y: 20 }}
                                        animate={{ opacity: 1, y: 0 }}
                                        exit={{ opacity: 0, y: -20 }}
                                        transition={{ delay: index * 0.05 }}
                                        className="guest-card"
                                        style={{ borderLeftColor: getBorderColor(guest.attendance) }}
                                    >
                                        <div className="flex items-start justify-between mb-2">
                                            <div className="flex items-center gap-3">
                                                <div className="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-700 font-playfair font-medium text-lg">
                                                    {guest.name.charAt(0)}
                                                </div>
                                                <div>
                                                    <h4 className="font-inter font-medium text-wedding-900 text-sm">{guest.name}</h4>
                                                    <p className="text-xs text-emerald-400">{guest.phone} • {guest.date}</p>
                                                </div>
                                            </div>
                                            <span className={`px-3 py-1 rounded-full text-xs font-medium ${getBadgeClass(guest.attendance)}`}>
                                                {getBadgeText(guest.attendance)}
                                            </span>
                                        </div>

                                        <div className="ml-13 pl-13">
                                            <div className="flex items-center gap-2 mb-1">
                                                <svg className="w-3 h-3 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                                                </svg>
                                                <span className="text-xs text-emerald-500 font-medium">{guest.guests} orang</span>
                                            </div>
                                            {guest.message && guest.message !== "-" && (
                                                <p className="text-sm text-wedding-700 italic mt-1 leading-relaxed bg-emerald-50/50 p-2 rounded-lg">
                                                    "{guest.message}"
                                                </p>
                                            )}
                                        </div>
                                    </motion.div>
                                ))}
                            </AnimatePresence>

                            {filteredGuests.length === 0 && (
                                <div className="text-center py-8 text-emerald-400 text-sm">
                                    🌸 Tidak ada tamu dengan status ini
                                </div>
                            )}
                        </div>

                        <Toast {...toast} />
                    </div>
                </section>
            );
        };

        const WeddingGift = () => {
            const [toast, setToast] = useState({ message: "", visible: false });

            const BankCard = ({ bank, number, name, label }) => (
                <div className="bg-white rounded-2xl p-5 md:p-6 border-2 border-emerald-100 transition-all hover:border-emerald-300 hover:shadow-lg hover:shadow-emerald-100/50">
                    <div className="flex items-center justify-between mb-3">
                        <span className="text-xs text-emerald-500 uppercase tracking-wider font-medium">{label}</span>
                        <span className="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-medium">{bank}</span>
                    </div>
                    <p className="font-mono text-lg md:text-xl text-wedding-900 font-medium mb-1">{number}</p>
                    <p className="text-sm text-emerald-500 mb-4">a.n {name}</p>
                    <button
                        onClick={() => copyToClipboard(`${bank}: ${number} a.n ${name}`, setToast)}
                        className="btn-outline"
                    >
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                        </svg>
                        Salin Nomor Rekening
                    </button>
                </div>
            );

            return (
                <section id="wedding-gift" className="py-16 md:py-24 px-4 floral-bg relative">
                    <div className="absolute top-10 left-10 text-5xl opacity-10">🌺</div>
                    <div className="absolute bottom-10 right-10 text-4xl opacity-10">🌸</div>
                    <div className="max-w-4xl mx-auto relative z-10">
                        <SectionTitle 
                            subtitle="Wedding Gift"
                            title="Hadiah Pernikahan"
                            description="Doa restu Anda adalah hadiah terindah. Bagi yang ingin memberikan tanda kasih, dapat melalui:"
                        />

                        <ScrollReveal>
                            <div className="glass-floral rounded-3xl p-6 md:p-10 mb-8">
                                <h3 className="font-playfair text-xl text-wedding-900 mb-6 text-center">💳 Transfer Bank</h3>
                                <div className="grid md:grid-cols-2 gap-4 md:gap-6">
                                    {BANK_ACCOUNTS.bride.map((account, idx) => (
                                        <BankCard key={idx} {...account} label="Pengantin Wanita" />
                                    ))}
                                    {BANK_ACCOUNTS.groom.map((account, idx) => (
                                        <BankCard key={idx} {...account} label="Pengantin Pria" />
                                    ))}
                                </div>
                            </div>
                        </ScrollReveal>

                        <ScrollReveal delay={0.2}>
                            <div className="glass-floral rounded-3xl p-6 md:p-10">
                                <h3 className="font-playfair text-xl text-wedding-900 mb-6 text-center">📦 Kirim Hadiah Fisik</h3>
                                <div className="bg-emerald-50/50 rounded-2xl p-5 md:p-6 border border-emerald-100">
                                    <div className="flex items-start gap-4">
                                        <div className="w-12 h-12 bg-emerald-100 rounded-full flex items-center justify-center flex-shrink-0">
                                            <svg className="w-6 h-6 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4" />
                                            </svg>
                                        </div>
                                        <div className="flex-1">
                                            <h4 className="font-medium text-wedding-900 mb-2">{GIFT_ADDRESS.label}</h4>
                                            <p className="text-sm text-emerald-600 leading-relaxed mb-1">
                                                {GIFT_ADDRESS.street}<br/>
                                                {GIFT_ADDRESS.kelurahan}<br/>
                                                {GIFT_ADDRESS.city}
                                            </p>
                                            <p className="text-xs text-emerald-400 italic mt-2">{GIFT_ADDRESS.recipient}</p>
                                        </div>
                                    </div>
                                    <button
                                        onClick={() => copyToClipboard(`${GIFT_ADDRESS.label}\n${GIFT_ADDRESS.street}\n${GIFT_ADDRESS.kelurahan}\n${GIFT_ADDRESS.city}\n${GIFT_ADDRESS.recipient}`, setToast)}
                                        className="btn-outline mt-4"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                        </svg>
                                        Salin Alamat
                                    </button>
                                </div>
                            </div>
                        </ScrollReveal>

                        <Toast {...toast} />
                    </div>
                </section>
            );
        };

        const Footer = () => (
            <footer className="py-12 md:py-16 px-4 section-floral text-center relative">
                <div className="absolute top-5 left-1/2 -translate-x-1/2 text-4xl opacity-10">🌸</div>
                <div className="max-w-2xl mx-auto relative z-10">
                    <ScrollReveal>
                        <div className="oval-frame w-16 h-20 mx-auto flex items-center justify-center mb-4">
                            <div className="text-center">
                                <div className="font-playfair text-lg text-silver-500">R</div>
                                <div className="text-emerald-400 text-xs">&</div>
                                <div className="font-playfair text-lg text-silver-500">A</div>
                            </div>
                        </div>
                        <h3 className="font-playfair text-2xl text-emerald-700 mb-2">Rafli & Alizza</h3>
                        <p className="text-emerald-500 text-sm mb-4 font-inter">Terima kasih atas doa dan restunya</p>
                        <div className="w-12 h-px bg-emerald-300 mx-auto mb-4" />
                        <p className="text-emerald-400 text-xs font-inter">Dibuat dengan ❤️ untuk hari istimewa kami</p>
                

                    </ScrollReveal>
                    <div style={{marginTop: '24px', paddingTop: '16px', borderTop: '1px solid rgba(52,211,153,0.3)', textAlign: 'center'}}>
                        <p style={{color: '#059669', fontSize: '12px', fontFamily: 'Inter, sans-serif', letterSpacing: '0.1em'}}>Design by <span style={{color: '#047857', fontWeight: 600}}>HilmiHaikal</span></p>
                    </div>
                </div>
            </footer>
        );

        const MusicPlayer = ({ isPlaying, onToggle }) => (
            <motion.button
                onClick={onToggle}
                className="fixed bottom-6 right-6 z-50 w-12 h-12 bg-emerald-500 text-white rounded-full flex items-center justify-center shadow-lg shadow-emerald-200/50"
                whileHover={{ scale: 1.1 }}
                whileTap={{ scale: 0.9 }}
                animate={isPlaying ? { rotate: [0, 360] } : { rotate: 0 }}
                transition={isPlaying ? { duration: 3, repeat: Infinity, ease: "linear" } : {}}
            >
                {isPlaying ? (
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                ) : (
                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                )}
            </motion.button>
        );

        const Navigation = () => {
            const [activeSection, setActiveSection] = useState("");

            useEffect(() => {
                const handleScroll = () => {
                    const sections = ["event", "couple", "rsvp", "wedding-gift"];
                    const scrollPosition = window.scrollY + 200;

                    for (const section of sections) {
                        const element = document.getElementById(section);
                        if (element) {
                            const offsetTop = element.offsetTop;
                            const offsetHeight = element.offsetHeight;
                            if (scrollPosition >= offsetTop && scrollPosition < offsetTop + offsetHeight) {
                                setActiveSection(section);
                                break;
                            }
                        }
                    }
                };

                window.addEventListener("scroll", handleScroll);
                return () => window.removeEventListener("scroll", handleScroll);
            }, []);

            const navItems = [
                { id: "event", label: "Acara", icon: "📅" },
                { id: "couple", label: "Mempelai", icon: "💑" },
                { id: "rsvp", label: "RSVP", icon: "✉️" },
                { id: "wedding-gift", label: "Hadiah", icon: "🎁" }
            ];

            return (
                <motion.nav 
                    className="fixed bottom-0 left-0 right-0 z-40 bg-white/90 backdrop-blur-lg border-t border-emerald-100 px-4 py-2 md:hidden"
                    initial={{ y: 100 }}
                    animate={{ y: 0 }}
                    transition={{ delay: 0.5 }}
                >
                    <div className="flex justify-around items-center">
                        {navItems.map((item) => (
                            <a
                                key={item.id}
                                href={`#${item.id}`}
                                className={`flex flex-col items-center gap-1 px-3 py-1 rounded-lg transition-all ${
                                    activeSection === item.id 
                                        ? 'text-emerald-600 bg-emerald-50' 
                                        : 'text-emerald-400'
                                }`}
                            >
                                <span className="text-lg">{item.icon}</span>
                                <span className="text-[10px] font-medium">{item.label}</span>
                            </a>
                        ))}
                    </div>
                </motion.nav>
            );
        };

                // ===== GOOGLE MAPS MODAL =====
        const MapModal = ({ isOpen, onClose, location, address }) => {
            if (!isOpen) return null;

            const mapEmbedUrl = "https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3966.0!2d105.0!3d-6.0!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x0%3A0x0!2zSG9vZCBWaWxsYSBHYXJkZW4gQ2lrb2xlIE1hamFzYXJpIFBhbmRlZ2xhbmc!5e0!3m2!1sen!2sid!4v1";

            return (
                <AnimatePresence>
                    {isOpen && (
                        <motion.div 
                            className="fixed inset-0 z-[60] flex items-center justify-center p-4"
                            initial={{ opacity: 0 }}
                            animate={{ opacity: 1 }}
                            exit={{ opacity: 0 }}
                        >
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={onClose} />
                            <motion.div 
                                className="relative bg-white rounded-3xl overflow-hidden shadow-2xl w-full max-w-2xl"
                                initial={{ scale: 0.9, opacity: 0, y: 20 }}
                                animate={{ scale: 1, opacity: 1, y: 0 }}
                                exit={{ scale: 0.9, opacity: 0, y: 20 }}
                                transition={{ type: "spring", stiffness: 300, damping: 25 }}
                            >
                                <div className="p-4 md:p-6 border-b border-emerald-100 flex items-center justify-between">
                                    <div>
                                        <h3 className="font-playfair text-xl text-wedding-900">📍 {location}</h3>
                                        <p className="text-emerald-500 text-sm mt-1">{address}</p>
                                    </div>
                                    <button 
                                        onClick={onClose}
                                        className="w-10 h-10 rounded-full bg-emerald-100 flex items-center justify-center text-emerald-600 hover:bg-emerald-200 transition-colors"
                                    >
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>
                                <div className="aspect-video w-full bg-emerald-50">
                                    <iframe 
                                        src={mapEmbedUrl}
                                        width="100%" 
                                        height="100%" 
                                        style={{ border: 0 }} 
                                        allowFullScreen="" 
                                        loading="lazy" 
                                        referrerPolicy="no-referrer-when-downgrade"
                                        className="w-full h-full"
                                    />
                                </div>
                                <div className="p-4 md:p-6 flex gap-3">
                                    <a 
                                        href="https://maps.google.com/?q=Hood+Villa+Garden+Cikole+Majasari+Pandeglang"
                                        target="_blank"
                                        rel="noopener noreferrer"
                                        className="btn-gold flex-1 text-center"
                                    >
                                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                                        </svg>
                                        Buka di Google Maps
                                    </a>
                                    <button 
                                        onClick={onClose}
                                        className="btn-outline flex-1"
                                    >
                                        Tutup
                                    </button>
                                </div>
                            </motion.div>
                        </motion.div>
                    )}
                </AnimatePresence>
            );
        };

const App = () => {
            const [isOpen, setIsOpen] = useState(false);
            const [guestName, setGuestName] = useState("");
            const [isPlaying, setIsPlaying] = useState(false);
            const [mapModalOpen, setMapModalOpen] = useState(false);
            const [selectedEvent, setSelectedEvent] = useState(null);
            const audioRef = useRef(null);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const name = params.get("to");
                if (name) setGuestName(decodeURIComponent(name));
            }, []);

            useEffect(() => {
                if (isOpen && !audioRef.current) {
                    audioRef.current = new Audio(MUSIC_URL);
                    audioRef.current.loop = true;
                }
            }, [isOpen]);

            const toggleMusic = () => {
                if (audioRef.current) {
                    if (isPlaying) {
                        audioRef.current.pause();
                    } else {
                        audioRef.current.play().catch(() => {});
                    }
                    setIsPlaying(!isPlaying);
                }
            };

            return (
                <div className="min-h-screen floral-bg">
                    <AnimatePresence>
                        {!isOpen && (
                            <CoverPage 
                                onOpen={() => { 
                                setIsOpen(true); 
                                // Create and play audio immediately when opening invitation
                                if (!audioRef.current) {
                                    audioRef.current = new Audio(MUSIC_URL);
                                    audioRef.current.loop = true;
                                }
                                audioRef.current.play().then(() => {
                                    setIsPlaying(true);
                                }).catch((err) => {
                                    console.log("Audio play failed:", err);
                                    setIsPlaying(false);
                                });
                            }} 
                                guestName={guestName} 
                            />
                        )}
                    </AnimatePresence>

                    {isOpen && (
                        <>
                            <FloatingPetals />
                            <ScrollReveal direction="up" delay={0.1}><HeroSection guestName={guestName} /></ScrollReveal>
                            <ScrollReveal direction="scale" delay={0.2}><CountdownTimer /></ScrollReveal>
                            <ScrollReveal direction="left" delay={0.4}><CoupleSection /></ScrollReveal>
                            <ScrollReveal direction="right" delay={0.6}><EventDetails /></ScrollReveal>
                            <ScrollReveal direction="scale" delay={0.8}><GallerySection /></ScrollReveal>
                            <ScrollReveal direction="up" delay={1.0}><RsvpSection guestName={guestName} /></ScrollReveal>
                            <ScrollReveal direction="left" delay={1.2}><WeddingGift /></ScrollReveal>
                            <ScrollReveal direction="up" delay={1.4}><Footer /></ScrollReveal>
                            <MapModal 
                                isOpen={mapModalOpen} 
                                onClose={() => setMapModalOpen(false)}
                                location={selectedEvent?.location || "Hood Villa Garden"}
                                address={selectedEvent?.address || "Cikole, Majasari, Pandeglang, Banten"}
                            />
                            <MusicPlayer isPlaying={isPlaying} onToggle={toggleMusic} />
                            <Navigation />
                        </>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
